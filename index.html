    <style>
      html, body {

        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      /* winit appends the canvas to <body> itself; its ResizeObserver turns
         this CSS size into the window's (physical-pixel) inner size. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #no-webgpu {
        display: none;
        color: #ddd;
        font: 16px sans-serif;
        padding: 2em;
      }
    </style>

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
